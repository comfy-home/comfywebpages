name: Rebuild CWP index

# packs/ + index.json are derived artifacts of src/ — regenerated here so
# submission PRs only ever carry their own src/<host>/<sub>/ folder.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild packs/ + index.json
        run: python3 tools/build_index.py

      - name: Commit regenerated catalog
        run: |
          if [ -n "$(git status --porcelain -- index.json packs)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.json packs
            git commit -m "chore: rebuild CWP index"
            git push
          else
            echo "index already up to date"
          fi
